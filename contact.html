  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Form</title>
</head>
<body>
    <div class="container">
        <h2>Booking Contact Form</h2>

        <form id="bookingForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email address">

            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Preferred Time</label>
            <input type="time" id="time" name="time" required>

            <label for="message">Your Chosen Activity </label>
            <textarea id="message" name="message" rows="4" placeholder="The activity you want to do type it here"></textarea>

            <button type="submit"><strong>Submit Booking Request</strong></button> 
        </form>
    </div>

    <script>
        document.getElementById('bookingForm').onsubmit = function(event) {
            event.preventDefault();  

           
            window.location.href = "thankyou.html";  
        };
    </script>
</body>
